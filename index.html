<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f2f4f6;--card:#fff;--t1:#191f28;--t2:#4e5968;--t3:#6b7684;--line:#f2f4f6;--blue:#3182f6;--up:#f04452;--down:#3182f6;--seg:#e5e8eb}
@media(prefers-color-scheme:dark){:root{--bg:#101012;--card:#1c1c1e;--t1:#f2f4f6;--t2:#c3c7cd;--t3:#8b95a1;--line:#2c2c2e;--seg:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;letter-spacing:-.01em;-webkit-user-select:auto;user-select:auto;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,.sel:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.rw{transition:background .15s}
html,body{touch-action:pan-x pan-y}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0px) + 32px)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 6px}
header h1{font-size:20px;margin:0;font-weight:700}
.sub{font-size:12px;color:var(--t3);margin-top:2px}
.hero{padding:6px 20px 0}
.hero .lb{font-size:14px;color:var(--t3);display:flex;align-items:center;justify-content:space-between}
.fxr{font-size:12px}
.plr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plr .pl{min-width:0}
.seg{position:relative;display:inline-flex;flex:none;background:var(--seg);border-radius:9px;padding:2px}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);background:var(--card);border-radius:7px;transition:transform .22s cubic-bezier(.3,.9,.3,1);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.b i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;padding:5px 10px;font-size:12px;font-weight:600;color:var(--t3);min-width:58px}
.seg button.on{color:var(--t1)}
.tr{display:flex;align-items:center;justify-content:space-between;gap:10px}
#pwTitle{-webkit-user-select:none;user-select:none}
.pwin{width:100%;font-size:24px;letter-spacing:.5em;text-align:center;padding:12px 0 12px .5em;border:1.5px solid var(--seg);border-radius:12px;background:var(--bg);color:var(--t1);outline:none}
.pwin:focus{border-color:var(--blue)}
.pwerr{min-height:18px;margin:8px 0 14px;font-size:13px;color:var(--up);text-align:center}
.pwb{display:flex;gap:8px}.pwb button{flex:1;padding:13px 0;border-radius:12px;font-weight:700;font-size:15px}.pwb .no{background:var(--seg);color:var(--t2)}
.shake{animation:shk .3s}@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sl{animation:sli .22s ease-out}
@keyframes sli{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.rf{width:36px;height:36px;border-radius:50%;background:var(--seg);color:var(--t2);display:grid;place-items:center;flex:none}.rf svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.rf.spin svg{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#pager{overflow:hidden;width:100%;touch-action:pan-y}
#track{display:flex;width:100%;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
#track.drag{transition:none}
.pane{flex:0 0 100%;min-width:0;height:0;overflow:hidden}
.pane.on,.pane.near{height:auto;overflow:visible}
.cbox.short{height:90px}
.rct{display:flex;align-items:center;gap:6px}.rct b{font-size:15px}.rct .pill{font-style:normal;font-size:12px;padding:2px 8px}
.rcb{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:2px 20px 8px;background:var(--line)}.rcb i{display:block;height:100%}
.rcs{display:grid;gap:6px;padding:0 16px}.rcs>div{background:var(--line);border-radius:10px;padding:7px 8px;min-width:0}
.rcs span{display:flex;align-items:center;font-size:11px;color:var(--t3);white-space:nowrap}.rcs span i{width:6px;height:6px;border-radius:50%;margin-right:5px;flex:none}
.rcs b{display:block;font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap}
.rcf{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;padding:8px 16px 6px;font-size:11px;color:var(--t3);white-space:nowrap}.rcf b{font-weight:700}
.rch{display:flex;align-items:baseline;gap:8px;padding:2px 20px 14px;white-space:nowrap}.rch>*{white-space:nowrap;flex:none}.rch .lbl{font-size:13px;color:var(--t3);margin-right:auto}.rch b{font-size:22px;font-weight:800;letter-spacing:-.3px}.rch .pill{font-style:normal}
.tile.fxg{padding:10px 12px}.fxg>span{font-size:12px;color:var(--t3);display:block}.fxg>b{display:block;font-size:20px;margin:2px 0 10px}.gz{position:relative;height:6px;border-radius:3px;background:var(--seg)}.gz::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--t3);opacity:.5}.gz i{position:absolute;top:0;bottom:0}.gz i.g{left:50%;background:var(--up);border-radius:0 3px 3px 0}.gz i.l{right:50%;background:var(--down);border-radius:3px 0 0 3px}.gz u{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2.5px solid var(--card);box-shadow:0 0 0 1px var(--line)}.gz u.g{background:var(--up)}.gz u.l{background:var(--down)}.gl{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--t3);line-height:1.35}.gl span{display:flex;flex-direction:column;align-items:flex-start;font-size:11px}.gl span:last-child{align-items:flex-end}.gl br{display:none}.gl b{font-size:13px;color:var(--t1)}.gl b.up{color:var(--up)}.gl b.dn{color:var(--down)}
.tile.dn1{display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left;padding:10px 12px}
.dnw{position:relative;flex:none;width:60px;height:60px}.dnw svg{transform:rotate(-90deg);display:block}
.dnw .dc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dn1 .tx{min-width:0}.dn1 .tx span{display:block;min-height:0;justify-content:flex-start;font-size:11px;color:var(--t3);margin-bottom:3px;white-space:nowrap}
.dn1 .tx em{display:flex;align-items:center;font-style:normal;font-size:12px;font-weight:600;color:var(--t2);margin-top:1px;white-space:nowrap}.dn1 .tx em i{width:6px;height:6px;border-radius:50%;margin-right:5px;flex:none}
.rct .tl{font-size:12px;font-weight:500;color:var(--t3);margin-right:2px;white-space:nowrap}
.sh>b,.rct{white-space:nowrap}.tt{display:inline-flex;align-items:center;gap:6px}#pnlModal,#pnlModal[hidden]{}#pnlModal{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}#pnlModal[hidden]{display:none}#pnlModal .mb{max-height:82vh;overflow:auto}#pnlModal h4{margin:0 0 4px;font-size:14px;color:var(--t1)}#pnlModal p{margin:0 0 14px}#pnlModal .ok{margin-top:4px}.rct{flex:none}
@media(max-width:360px){.tile.dn1{gap:8px;padding:10px 8px}.dnw,.dnw svg{width:50px;height:50px}.dnw .dc{font-size:11px}.dn1 .tx span{font-size:10.5px}.ov .sh{padding:12px 16px 6px;gap:8px}.rct{gap:4px}.rct b{font-size:14px}.rct .tl{font-size:11px;margin-right:0}.rct .pill{padding:2px 6px}}
.sp3{display:grid;grid-template-columns:84px 1fr 112px;align-items:center;gap:10px;padding:8px 20px}
.sp3 .nm{display:flex;align-items:center;font-size:14px;white-space:nowrap}.sp3 .nm i{width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none}
.sp3 .am{font-size:15px;font-weight:700;white-space:nowrap;text-align:right}
.dv{position:relative;display:block;height:8px;border-radius:4px;background:var(--line)}
.dv::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--t3);opacity:.45}
.dv i{position:absolute;top:0;bottom:0;display:block}.dv i.g{left:50%;border-radius:0 4px 4px 0;background:var(--up)}.dv i.l{right:50%;border-radius:4px 0 0 4px;background:var(--down)}
@media(max-width:360px){.sp3{grid-template-columns:82px 1fr 96px;gap:6px;padding:8px 16px}.sp3 .nm i{margin-right:6px}.sp3 .am{font-size:14px}}
.spr{padding:7px 20px}.spr>span:last-child{font-size:15px;font-weight:700}
@media(max-width:360px){.rch b{font-size:18px}.rcs b{font-size:11.5px}.rcs>div{padding:7px 6px}}
.fxbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:2px 20px 10px;background:var(--line)}
.fxbar i{display:block;height:100%}
.spr{display:flex;align-items:center;justify-content:space-between;padding:4px 20px;font-size:14px}
.spr span:first-child{display:flex;align-items:center;color:var(--t2,inherit)}
.spr i{width:8px;height:8px;border-radius:50%;margin-right:8px;display:inline-block}
.spr~.tiles{padding-top:10px}
.ov .cbox.short{margin:0 16px 6px}
.ov .big{padding:0 20px 10px;display:flex;align-items:center;gap:8px}
.ov .big .lbl{font-size:13px;color:var(--t3);margin-right:auto}
.ov .big b{font-size:16px;font-weight:700}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 8px}
.st{background:var(--line);border-radius:10px;padding:6px 4px;text-align:center;min-width:0}
.st span{display:block;font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.st b{display:block;font-size:14px;font-weight:700;margin-top:1px}
.st em{display:block;font-style:normal;font-size:10px;font-weight:600;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700;background:var(--line);color:var(--t3);white-space:nowrap}
.pill.up{background:rgba(240,68,82,.12);color:var(--up)}.pill.dn{background:rgba(49,130,246,.12);color:var(--down)}
.ov .rows{border-top:1px solid var(--line);margin:0 20px;padding:4px 0 2px}
.crow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px}
.crow .nm2{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:600}
.crow .amt{font-size:13px;font-weight:600}
.dot2{width:10px;height:10px;border-radius:50%;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 16px 14px}
.tile{background:var(--line);border-radius:12px;padding:10px 6px;min-width:0;text-align:center}
.tile span{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);line-height:1.2;min-height:14px;word-break:keep-all}
.tile b{display:block;font-size:15px;font-weight:700;margin-top:3px;white-space:nowrap}
.tile.stale b,.tile.stale em{opacity:.55}
.tile em{display:block;font-style:normal;font-size:12px;font-weight:600;margin-top:2px}
.fhr{display:flex;align-items:center;gap:8px;min-width:0}.fhr .fxr{white-space:nowrap}.fhr .cu{height:28px}.cu button{min-width:32px;padding:0;height:24px;line-height:24px}.sel{height:28px;padding-top:0;padding-bottom:0}
.lt{padding:4px 16px 0}
.lv{display:inline-grid;grid-template-columns:repeat(4,1fr)}.lv i{width:calc((100% - 4px)/4)}.lv.p1 i{transform:translateX(100%)}.lv.p2 i{transform:translateX(200%)}.lv.p3 i{transform:translateX(300%)}
.lv button{padding:7px 14px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap}
.lv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.flat{padding:0 16px}.flat .row{padding:0}.flat .rw{padding:12px 4px}.flat .rw:active{background:var(--seg)}.flat .dt{background:var(--card);margin:0 0 8px}
.fh{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 6px;font-size:13px;color:var(--t3)}.fh b{font-size:14px;font-weight:600;color:var(--t2)}
.pw{padding:0 16px}.pw .cbox.pie{margin:10px 0 6px}.pw .pleg{padding:6px 4px 10px}

function parseCSV(t,keep){const o=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){r.push(f);f=""}
 else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";o.push(r);r=[]}else f+=c}
 if(f||r.length){r.push(f);o.push(r)}return keep?o:o.filter(x=>x.some(y=>y.trim()))}
const num=s=>{const v=parseFloat(String(s||"").replace(/[^0-9.\-]/g,""));return isNaN(v)?0:v};
const optNum=s=>{const raw=String(s||"").trim();if(!raw)return null;const v=parseFloat(raw.replace(/[^0-9.\-]/g,""));return isNaN(v)?null:v};

 return t.slice(1).map((r,idx)=>{
  const usd=g(r,"해외종목여부").toUpperCase()==="USD",expF=ei>=0&&/^(y|yes|o|v|✓|true|1|예|환노출)$/i.test(String(r[ei]||"").trim()),fx=num(g(r,"기준환율"))||1,avg=num(g(r,"평균매입환율"))||fx;
  const qty=num(g(r,"수량")),price=num(g(r,"현재가")),cost=num(g(r,"매수단가"));

  const vK=num(g(r,"평가금액(원화)"))||(usd?vL*fx:vL),cK=usd?cL*avg:cL;
  const lv=li>=0?num(String(r[li]||"").replace(/[^0-9.]/g,"")):0;

   v:{KRW:vK,USD:usd?vL:vL/fx},c:{KRW:cK,USD:usd?cL:cL/fx}}}).filter(x=>x.name)}

 let col=-1;
 for(let r=0;r<3&&col<0;r++){const i=(t[r]||[]).findIndex(c=>String(c).includes("순입금"));if(i>=0)col=i}
 const val=t[3]||[];

}

 for(let r=0;r<3&&col<0;r++){const i=(t[r]||[]).findIndex(c=>String(c).includes("비밀번호"));if(i>=0)col=i}

// 기타데이터 시트 4행부터: A~C 섹터별 변동, F~H 섹터구분코드(코드/이름/정렬), I~J 주요지표(이름/값), K~L 총 평가금액 변동(값/퍼센티지)
const CHGRE=/[\s\-–·:]*변동\s*(퍼센티지|퍼센트|률|율)?\s*$/;
function parseOtherInfo(text,noSave){
 const t=parseCSV(text,true),rows=t;
 const c=(r,i)=>String((r&&r[i])||"").trim();
 rows.forEach(r=>{const code=c(r,5),nm=c(r,6),od=optNum(c(r,7));if(code&&nm){SN[code]=nm;if(od!==null)SECORD[code]=od}});
 const sectors=[];let total=null;
 rows.forEach(r=>{
  const l=c(r,0);if(!l)return;
  const v=optNum(c(r,1)),p=optNum(c(r,2));
  if(v===null&&p===null)return;
  if(/총\s*평가금액/.test(l)){total={v,p};return}
  if(/환율/.test(l))return;
  const us=/^A\s*\+\s*B$/i.test(l)||l.includes("미국지수");
  sectors.push({key:us?"A+B":l,name:us?"미국지수":(SN[l]||l),v,p});
 });
 const raw=[];
 rows.forEach(r=>{const l=c(r,8);if(!l)return;if(l==="이름"||l==="주요 지표")return;const t=c(r,9);if(t==="값")return;raw.push({label:l,v:optNum(t),t})});
 const ind=[];let last=null;
 raw.forEach(x=>{
  if(!CHGRE.test(x.label)){last={label:x.label,v:x.v,t:x.t,chg:null,ct:""};ind.push(last);return}
  const base=x.label.replace(CHGRE,"").trim();
  const free=y=>y.chg===null&&!y.ct;
  const m=ind.find(y=>y.label===base&&free(y))
   ||ind.filter(y=>base&&free(y)&&(y.label.startsWith(base)||base.startsWith(y.label))).sort((p,q)=>q.label.length-p.label.length)[0]
   ||last;
  if(m&&m.chg===null&&!m.ct){m.chg=x.v;m.ct=x.v===null?(x.t||"–"):""}else ind.push({label:x.label,v:x.v,t:x.t,chg:null,ct:"",solo:true});
 });
 let snapAt=0,ind2=ind;
 /* 3개 지표 스냅샷: 전부 정상이면 저장, 하나라도 문제면 저장된 스냅샷을 대신 보여줌 */
 const bad=!ind.length||ind.some(x=>!x.solo&&(x.v===null||x.ct));
 try{
  if(!bad&&!noSave)LS.set("indsnap",JSON.stringify({at:Date.now(),ind}));
  else{const sn=JSON.parse(LS.get("indsnap","null"));if(sn&&sn.ind&&sn.ind.length){ind2=sn.ind;snapAt=sn.at}}
 }catch(e){}
 for(const r of rows){
  const a=c(r,10),b=c(r,11);if(!a&&!b)continue;
  let v=null,p=null;
  for(const x of [a,b]){if(!x)continue;if(x.includes("%")){if(p===null)p=optNum(x)}else if(v===null&&/\d/.test(x))v=optNum(x)}
  if(v!==null||p!==null){total={v,p};break}
 }
 const idx={};
 rows.forEach(r=>{const tk=c(r,12).toUpperCase();if(!tk)return;const p=optNum(c(r,14)),hi=optNum(c(r,16)),lo=optNum(c(r,17));if(p!==null&&hi!==null&&lo!==null&&hi>lo)idx[tk]={p,hi,lo}});
 return{sectors,ind:ind2,total,snapAt,idx};
}

const SUBGRID={id:"subgrid",beforeDatasetsDraw(chart){
 const {ctx,chartArea:a,scales:{x,y}}=chart;
 if(!x||!y||!a)return;
 const dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
 ctx.save();
 ctx.strokeStyle=dark?"rgba(255,255,255,0.045)":"rgba(0,0,0,0.04)";
 ctx.lineWidth=1;
 ctx.beginPath();
 // 가로 보조선: 기존 눈금선 사이 중간에 한 줄씩 추가
 const ys=y.ticks.map(k=>y.getPixelForValue(k.value)).sort((m,n)=>m-n);
 for(let i=0;i<ys.length-1;i++){const m=Math.round((ys[i]+ys[i+1])/2)+.5;ctx.moveTo(a.left,m);ctx.lineTo(a.right,m)}
 // 세로 보조선: 데이터 행(점)마다 한 줄, 행이 많으면 간격을 띄워서 그림
 const n=chart.data.labels.length;
 if(n>1){
  const gap=Math.abs(x.getPixelForValue(1)-x.getPixelForValue(0));
  const step=Math.max(1,Math.ceil(14/Math.max(gap,1)));
  for(let i=0;i<n;i+=step){const px=Math.round(x.getPixelForValue(i))+.5;ctx.moveTo(px,a.top);ctx.lineTo(px,a.bottom)}
 }
 ctx.stroke();
 ctx.restore();
}};

 });

async function fetchText(url){
 const res=await fetch(url+"&_="+Date.now(),{cache:"no-store"});
 if(!res.ok)throw new Error("HTTP "+res.status);
 const text=await res.text();
 if(text.trim().startsWith("<"))throw new Error("CSV가 아닌 응답");
 return text;
}

async function load(manual){
 let why="",ok=false;
 let tm;
 const timeout=new Promise((_,rej)=>{tm=setTimeout(()=>{const er=new Error("timeout");er.name="AbortError";rej(er)},12000)});
 try{
  const [mainRes,chartRes,otherRes]=await Promise.race([Promise.allSettled([fetchText(CSV_URL),fetchText(CHART_CSV_URL),fetchText(OTHER_CSV_URL)]),timeout]);
  if(chartRes.status==="fulfilled"){
   const parsedChart=buildChart(chartRes.value);
   if(parsedChart.length)chartRows=parsedChart;
  }
  if(otherRes.status==="fulfilled"){try{const n=parseOtherNet(otherRes.value);if(n)NET=n;const pw=parseOtherPw(otherRes.value);if(pw)PW=pw;OTHER=parseOtherInfo(otherRes.value);OTHERERR=""}catch(e){OTHERERR="해석 오류"}}else{OTHERERR=(otherRes.reason&&otherRes.reason.message)||"네트워크"}
  if(mainRes.status!=="fulfilled"){why=mainRes.reason&&mainRes.reason.message||"불러오기 실패";throw 0}
  if(!mainRes.value.includes("종목명")){why="CSV가 아닌 응답";throw 0}
  const next=build(mainRes.value);
  if(!next.length){why="데이터 없음";throw 0}
  items=next;src="구글시트 · "+clock()+" 기준";render();ok=true;
  if(manual)toast("최신 데이터로 바꿨어요");
 }catch(e){
  if(!why)why=e&&e.name==="AbortError"?"시간 초과":"네트워크";
  if(/fetch|network|load failed|cloned/i.test(why))why="네트워크";
  if(why==="CSV가 아닌 응답")why="응답 오류";
  src=src.replace(/ · 갱신 실패.*$/,"")+" · 갱신 실패("+why+")";
  $("upd").textContent=src;
  if(chartRows.length)render();
  if(manual)toast("불러오지 못했어요 · "+why);
 }finally{clearTimeout(tm);if(ok)$("introMsg").parentNode.style.visibility="hidden";else{$("introMsg").textContent="저장된 데이터로 시작해요";$("dots").style.display="none"}loaded=true;tryClose();if(lview==="chart"||lview==="pnl"||lview==="fc")render()}
}

const pm=()=>$("pnlModal");$("pnlOk").onclick=()=>{pm().hidden=true};pm().onclick=e=>{if(e.target===pm())pm().hidden=true};const PT={"주가손익":"매입 당시의 환율을 기준으로 계산한 주가 이익 금액이에요. 환노출 ETF를 제외한 모든 종목이 포함돼요.","환차손익":"매입할 때와 지금의 환율 차이로 생긴 손익 금액이에요. 해외상장종목만 포함돼요.","환노출 ETF":"국내상장 해외 ETF의 손익 금액이에요. 주가와 환율이 모두 영향을 줘요.","고점, 저점 기준":"52주 최고가를 고점, 최저가를 저점으로 해요. 종목마다 고(고점), 중(고점과 저점의 중간값), 저(저점) 중 하나를 고르면, 고른 종목들의 예상 손익이 합산돼요. 선택한 버튼을 다시 누르면 해제돼요.","영향 종목 기준":"나스닥100(A), S&P500(B) 섹터로 지정된 종목을 가져와요. 레버리지 종목은 평가금액에 레버리지 배수를 곱해서 지수 종목에 합산해요.","기대 총 손익":"현재 총 손익에 예상 주가 변동액(고/중/저 선택분)과 예상 환율 변동액을 더한 값이에요. 예상 환율 변동액에는 선택한 주가 변동분에 환율이 적용되는 몫도 포함돼 있어요.\n투자수익 토글을 켜면 현재 총 손익과 퍼센트가 순입금액 기준으로 바뀌어요.","예상 환율":"해외상장종목과 환노출 ETF의 평가금액에만 환율 변동을 반영해 계산한 값이에요. 원화 자산은 포함되지 않아요. 예상 주가에서 고른 변동분도 환율 계산에 반영돼요.","현금성 자산":"변동성이 적어서 주가 변동으로는 금액이 변하지 않는다고 가정해요. 환율 효과만 반영돼요."};document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-pnl]");if(b){const k=b.dataset.pnl;$("pnlT").textContent=k;$("pnlP").textContent=PT[k]||(window.PTX&&PTX[k])||"";pm().hidden=false}});

let pwTap=0,pwTapT=0;
function openPw(){pwTap=0;const i=$("pwIn");i.value="";$("pwErr").textContent=PW?"":"비밀번호를 불러오지 못했어요. 연결을 확인해 주세요";$("pwModal").hidden=false;setTimeout(()=>i.focus(),50)}
function closePw(){$("pwModal").hidden=true;$("pwIn").blur()}
function tryPw(){
 const i=$("pwIn"),v=i.value;
 if(!PW){$("pwErr").textContent="비밀번호를 불러오지 못했어요. 연결을 확인해 주세요";return}
 if(v===PW){closePw();showAmt=true;LS.set("amt","1");syncEye();render();return}
 $("pwErr").textContent="비밀번호가 맞지 않아요";i.value="";i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");i.focus();
}
$("rfBtn").onclick=()=>{$("rfBtn").classList.add("spin");setTimeout(()=>location.reload(),150)};

$("pwTitle").onclick=()=>{const n=Date.now();pwTap=(n-pwTapT>2000)?1:pwTap+1;pwTapT=n;if(pwTap>=10){pwTap=0;closePw();showAmt=true;LS.set("amt","1");syncEye();render()}};

 const k=b.dataset.k;openKey=openKey===k?null:k;render()};

// 툴팁 닫기: 차트 바깥을 누르거나, 스크롤하면 닫힘 (스크롤 중에는 툴팁을 보이지 않음)
function hideTips(except){
 [chartInst,compInst,pieInst].forEach(c=>{
  if(!c||c.canvas===except)return;
  try{
   if(!c.tooltip||!c.tooltip.getActiveElements().length)return;
   c.setActiveElements([]);
   c.tooltip.setActiveElements([],{x:0,y:0});
   c.update("none");
  }catch(err){}
 });
}
document.addEventListener("pointerdown",e=>hideTips(e.target.closest&&e.target.closest("canvas")));
window.addEventListener("scroll",()=>hideTips(null),{passive:true});$("sc").addEventListener("scroll",()=>hideTips(null),{passive:true});

syncNet();render();applyTab(true);load(false);
