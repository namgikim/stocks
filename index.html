<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>우리집 주식</title>

<style>
:root{--bg:#f2f4f6;--card:#fff;--t1:#191f28;--t2:#4e5968;--t3:#8b95a1;--line:#f2f4f6;--blue:#3182f6;--up:#f04452;--down:#3182f6;--seg:#e5e8eb}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;letter-spacing:-.01em;-webkit-user-select:auto;user-select:auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
html,body{touch-action:pan-x pan-y}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0px) + 32px)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px}
header h1{font-size:20px;margin:0;font-weight:700}
.sub{font-size:12px;color:var(--t3);margin-top:2px}
.hero{padding:10px 20px 0}
.hero .lb{font-size:14px;color:var(--t3);display:flex;align-items:center;justify-content:space-between}
.fxr{font-size:12px}
.plr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plr .pl{min-width:0}
.seg{position:relative;display:inline-flex;flex:none;background:var(--seg);border-radius:9px;padding:2px}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);background:var(--card);border-radius:7px;transition:transform .22s cubic-bezier(.3,.9,.3,1);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.b i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;padding:5px 10px;font-size:12px;font-weight:600;color:var(--t3);min-width:58px}
.seg button.on{color:var(--t1)}
.tr{display:flex;align-items:center;justify-content:space-between;gap:10px}.cu button{min-width:30px;padding:5px 0}
.swr{display:flex;align-items:center;gap:4px;flex:none}.swr .sw{padding:0}.swl{font-size:12px;font-weight:600;color:var(--t3);margin-right:4px}.inf{position:relative;display:grid;place-items:center;width:13px;height:13px;border:1.3px solid var(--t3);border-radius:50%;color:var(--t3);font-size:9px;font-weight:800;line-height:1;padding:0}.inf::before{content:"";position:absolute;inset:-9px}
#modal{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}#modal[hidden]{display:none}.mb{background:var(--card);border-radius:20px;padding:24px 20px 16px;width:100%;max-width:320px}.mb h3{margin:0 0 14px;font-size:17px}.mb .amt{font-size:22px;font-weight:800;margin-bottom:8px}.mb p.lead{font-size:15px;font-weight:600;color:var(--t1);margin-bottom:18px}.mb .sub2{border-top:1px solid var(--seg);padding-top:16px;font-size:13px;color:var(--t3);margin-bottom:4px}.mb p{word-break:keep-all;margin:0 0 18px;font-size:14px;line-height:1.55;color:var(--t2)}.mb .ok{width:100%;padding:13px 0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:15px}
.sw{display:inline-flex;align-items:center;gap:8px;flex:none;font-size:12px;font-weight:600;color:var(--t3)}.sw b{position:relative;width:34px;height:20px;border-radius:10px;background:var(--seg);transition:background .2s;flex:none}.sw b::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}.sw.on{color:var(--t1)}.sw.on b{background:var(--blue)}.sw.on b::after{transform:translateX(14px)}

.pleg{padding:6px 20px 10px;display:flex;flex-direction:column;gap:8px;-webkit-user-select:none;user-select:none}
.pli{display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:8px}
.pli-l{display:flex;align-items:center;gap:8px;min-width:0}
.pli-dot{width:9px;height:9px;border-radius:50%;flex:none}
.pli-nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli-r{display:flex;align-items:center;gap:8px;flex:none}
.pli-v{color:var(--t3);font-size:12px}
.pli-p{font-weight:700;min-width:44px;text-align:right}
.total{font-size:32px;font-weight:800;margin:10px 0 4px;line-height:1.2}
.pl{font-size:15px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--t3)}
.alloc{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:14px 20px 0;gap:2px}
.alloc span{display:block;height:100%}
.sec{background:var(--card);border-radius:20px;margin:14px 16px 0;padding:8px 0 6px}
.sec canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px}
.sh b{font-size:16px}
.sh span{font-size:13px;color:var(--t3)}
.row{padding:0 4px}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;border-radius:14px}
.rw:active{background:var(--line)}
.av{position:relative;overflow:hidden;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:12px;color:var(--t3)}
.vl{text-align:right;flex:none}
.vl b{display:block;font-size:15px;font-weight:600}
.vl small{font-size:12px;font-weight:500}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 16px 8px;padding:14px 16px;background:var(--line);border-radius:14px;font-size:13px}
.dt div span{display:block;color:var(--t3);font-size:12px;margin-bottom:2px}
.dt div b{font-weight:600}
.dt[hidden]{display:none}
.note{white-space:pre-line;text-align:center;color:var(--t3);font-size:12px;padding:20px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);background:rgba(25,31,40,.92);color:#fff;font-size:14px;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#intro{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#intro.out{opacity:0;visibility:hidden}
.logo{width:88px;height:88px;border-radius:28px;background:var(--blue);display:grid;place-items:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.logo svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#intro h2{margin:26px 0 6px;font-size:26px;font-weight:800;color:#191f28;animation:fu .6s .35s both}
#intro p{margin:0;font-size:15px;color:#6b7684;animation:fu .6s .5s both}
#dots b{font-weight:400;animation:bl 1.2s infinite both}
#dots b:nth-child(2){animation-delay:.2s}
#dots b:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.15}40%{opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fu{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="intro">
  <div class="logo"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></div>
  <h2>우리집 주식</h2>
  <p><span id="introMsg">최신 시세를 조회하고 있어요</span><span id="dots"><b>.</b><b>.</b><b>.</b></span></p>
</div>

<div id="app">
  <div class="top">
  <header>
    <div><h1>우리집 주식</h1><div class="sub" id="upd">불러오는 중</div></div>
    <div class="seg vw" id="view"><i></i>
      <button data-v="list" class="on" aria-label="리스트"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button data-v="chart" aria-label="차트"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg></button>
    </div>
  </header>

    <div class="tr"><div class="total" id="total">-</div><div class="seg cu" id="mode"><i></i><button data-m="avg" class="on">₩</button><button data-m="usd">$</button></div></div>
    <div class="plr"><div class="pl" id="pl"></div><div class="swr"><button class="inf" id="infoBtn" aria-label="투자수익 설명">!</button><span class="swl" id="swl">투자수익</span><button class="sw" id="netBtn" aria-pressed="false" aria-label="투자수익 기준 전환"><b></b></button></div></div>

  </div>
  <main id="list"></main>
  <main id="charts" hidden></main>

</div>
<div id="toast"></div>
<div id="modal" hidden><div class="mb" role="dialog" aria-modal="true"><h3>투자수익</h3><p class="lead">투자수익은 순입금액을 기준으로 상승한 금액을 의미해요. 종목을 사고팔아도 오차 없이 보이는 내 전체 성과예요.</p><div class="sub2">순입금액</div><div class="amt" id="modalAmt">-</div><p>이 금액은 삼성증권(해외, ISA), 신한증권(국내, ISA, 연금), KB증권(국내, 연금, 금현물) 계좌의 순입금액을 모두 합한 금액이에요.</p><button class="ok" id="modalOk">확인</button></div></div>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTq_lLeMyEq0Lp57xFHAkZakHbHERiBrmgtgNiw70DS7wA2481vOB3P4Okfoxx-YJiVkebt1bQ5XzD8/pub?gid=1608565878&single=true&output=csv";

const SNAPSHOT=`섹터구분,종목명,티커,해외종목여부,현재가,매수단가,수량,평가금액,평가금액(원화),기준환율,평균매입환율,수익률,수익률(+환차익)

const $=id=>document.getElementById(id);
const COLORS=["#3182f6","#6b5cf6","#13b5a3","#f59f00","#f04452","#4e5968"];
const SC={A:"#f04452",B:"#f8939b",C:"#2f4a9e",D:"#f59f00",E:"#12b886"};
const SEC_SHADES={
 A:["#9f1239","#dc2626","#f04452","#fb7185"],
 B:["#ec4899","#f472b6","#f9a8d4","#fbcfe8"],
 C:["#1e3a8a","#2563eb","#3b82f6","#60a5fa"],
 D:["#d97706","#f59e0b","#fbbf24","#fcd34d"],
 E:["#059669","#10b981","#34d399","#6ee7b7"]
};
const col=(s,i)=>SC[s]||COLORS[i%COLORS.length];
const SN={A:"나스닥100",B:"S&P500",C:"가치주",D:"소액 투자",E:"현금성 자산"};
let view="list",mode="avg",useNet=false,NET=0,items=[],cur="KRW",openKey=null,src="저장된 데이터";

function parseCSV(t){const o=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){r.push(f);f=""}
 else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";o.push(r);r=[]}else f+=c}
 if(f||r.length){r.push(f);o.push(r)}return o.filter(x=>x.some(y=>y.trim()))}
const num=s=>{const v=parseFloat(String(s||"").replace(/[^0-9.\-]/g,""));return isNaN(v)?0:v};
const optNum=s=>{const raw=String(s||"").trim();if(!raw)return null;const v=parseFloat(raw.replace(/[^0-9.\-]/g,""));return isNaN(v)?null:v};

function build(text,defNet){
 const t=parseCSV(text),h=t[0].map(x=>x.trim()),g=(r,k)=>(r[h.indexOf(k)]||"").trim();
 const ni=h.findIndex(x=>x.includes("순입금")),nk=ni>=0?ni:14;NET=num((t[1]||[])[nk])||defNet||0;
 return t.slice(1).map((r,idx)=>{
  const usd=g(r,"해외종목여부").toUpperCase()==="USD",fx=num(g(r,"기준환율"))||1,avg=num(g(r,"평균매입환율"))||fx;
  const qty=num(g(r,"수량")),price=num(g(r,"현재가")),cost=num(g(r,"매수단가"));
  const vL=price*qty,cL=cost*qty;
  const vK=num(g(r,"평가금액(원화)"))||(usd?vL*fx:vL),cK=usd?cL*avg:cL;
  return{idx,logo:(r[13]||"").trim(),sector:g(r,"섹터구분"),name:g(r,"종목명"),ticker:g(r,"티커"),usd,fx,avg,qty,price,cost,
   v:{KRW:vK,USD:usd?vL:vL/fx},c:{KRW:cK,USD:usd?cL:cL/fx}}}).filter(x=>x.name)}

function buildChart(text){
 const t=parseCSV(text);
 return t.slice(1).map(r=>{
  const x=(r[1]||"").trim();
  const y=optNum(r[2]);
  const f=optNum(r[5]);
  const g=optNum(r[6]);
  const i=optNum(r[8]);
  const k=optNum(r[10]);
  const m=optNum(r[12]);
  return{x,y,f,g,i,k,m};
 }).filter(d=>Boolean(d.x)&&(d.y!==null||d.f!==null||d.g!==null||d.i!==null||d.k!==null||d.m!==null));
}

const won=v=>Math.round(v).toLocaleString("ko-KR")+"원";
const dol=v=>"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>cur==="KRW"?won(v):dol(v);
const sign=v=>v>0?"+":v<0?"-":"";
const cls=v=>v>0?"up":v<0?"dn":"fl";
const pct=v=>sign(v)+Math.abs(v).toFixed(2)+"%";
const native=(it,v)=>it.usd?"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):won(v);

function fmtAxis(v){
 if(Math.abs(v)>=1e8)return(v/1e8).toFixed(1).replace(/\.0$/,"")+"억";
 if(Math.abs(v)>=1e4)return Math.round(v/1e4).toLocaleString("ko-KR")+"만";
 return v.toLocaleString("ko-KR",{maximumFractionDigits:1});
}

function fmtCompVal(v){
 if(v===null||v===undefined||isNaN(v))return"-";
 if(Math.abs(v)>=1e4)return won(v);
 return v.toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtDay(str){
 const m=String(str).trim().match(/(\d{1,2})\s*일?$/);
 return m?Number(m[1])+"일":str;
}

const SUBGRID={id:"subgrid",beforeDatasetsDraw(chart){
 const {ctx,chartArea:a,scales:{x,y}}=chart;
 if(!x||!y||!a)return;
 const dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
 ctx.save();
 ctx.strokeStyle=dark?"rgba(255,255,255,0.045)":"rgba(0,0,0,0.04)";
 ctx.lineWidth=1;
 ctx.beginPath();
 // 가로 보조선: 기존 눈금선 사이 중간에 한 줄씩 추가
 const ys=y.ticks.map(k=>y.getPixelForValue(k.value)).sort((m,n)=>m-n);
 for(let i=0;i<ys.length-1;i++){const m=Math.round((ys[i]+ys[i+1])/2)+.5;ctx.moveTo(a.left,m);ctx.lineTo(a.right,m)}
 // 세로 보조선: 데이터 행(점)마다 한 줄, 행이 많으면 간격을 띄워서 그림
 const n=chart.data.labels.length;
 if(n>1){
  const gap=Math.abs(x.getPixelForValue(1)-x.getPixelForValue(0));
  const step=Math.max(1,Math.ceil(14/Math.max(gap,1)));
  for(let i=0;i<n;i+=step){const px=Math.round(x.getPixelForValue(i))+.5;ctx.moveTo(px,a.top);ctx.lineTo(px,a.bottom)}
 }
 ctx.stroke();
 ctx.restore();
}};

function getPieItems(){
 const secCount={};
 const list=items.map((it,i)=>{
  const s=it.sector||"";
  const idx=secCount[s]||0;
  secCount[s]=idx+1;
  const shades=SEC_SHADES[s];
  const pieColor=shades?shades[idx%shades.length]:COLORS[i%COLORS.length];
  return{...it,pieColor};
 });
 if(pieSort==="high")list.sort((a,b)=>b.v.KRW-a.v.KRW);
 return list;
}

 const cv=$("pieChart");
 if(!cv)return;
 if(pieInst){pieInst.destroy();pieInst=null}

 if(!list.length||typeof Chart==="undefined")return;
 const dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
 const total=list.reduce((s,x)=>s+x.v.KRW,0);
 pieInst=new Chart(cv.getContext("2d"),{
  type:"doughnut",
  data:{
   labels:list.map(x=>x.name),
   datasets:[{

    hoverOffset:6
   }]
  },
  options:{
   responsive:true,
   maintainAspectRatio:false,
   animation:false,
   cutout:"56%",
   plugins:{
    legend:{display:false},
    tooltip:{
     backgroundColor:dark?"rgba(44,44,46,0.95)":"rgba(25,31,40,0.92)",

     bodyColor:"#fff",

function syncNet(){$("swl").classList.toggle("on",useNet);$("netBtn").classList.toggle("on",useNet);$("netBtn").setAttribute("aria-pressed",useNet)}
function setMode(m){mode=m;$("mode").classList.toggle("b",m==="usd");[...$("mode").querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x.dataset.m===m))}
function render(){
 if(useNet&&!NET){useNet=false;syncNet()}
 const sum=(a,k)=>a.reduce((s,x)=>s+x[k][cur],0);
 const tv=sum(items,"v"),tc=sum(items,"c"),base=useNet?NET:tc,tp=tv-base;
 $("total").textContent=money(tv);
 $("pl").className="pl "+cls(tp);
 $("pl").textContent=sign(tp)+money(Math.abs(tp))+" ("+pct(base?tp/base*100:0)+")";
 const secs=[...new Set(items.map(x=>x.sector))];
 $("alloc").innerHTML=secs.map((s,i)=>{const w=sum(items.filter(x=>x.sector===s),"v")/tv*100;return`<span style="width:${w}%;background:${col(s,i)}"></span>`}).join("");
 $("list").innerHTML=secs.map((s,i)=>{
  const g=items.filter(x=>x.sector===s),sv=sum(g,"v");
  return`<section class="sec"><div class="sh"><b><span style="color:${col(s,i)}">●</span> ${SN[s]||"섹터 "+s}</b><span>${money(sv)} · ${(sv/tv*100).toFixed(1)}%</span></div>`+
  g.map(it=>{
   const useU=mode==="usd"&&it.usd,m=useU?"USD":((cur==="USD"&&!it.usd)?"KRW":cur),f=m==="KRW"?won:dol;
   const p=it.v[m]-it.c[m],r=it.c[m]?p/it.c[m]*100:0,k=it.ticker,o=openKey===k;
   const ab=/^[A-Za-z]/.test(it.ticker)?it.ticker.slice(0,2):it.name.slice(0,1);
   const pu=(it.price-it.cost)*it.qty,ru=it.cost?(it.price/it.cost-1)*100:0;
   const ex=(it.usd&&useU)?`<div><span>평균매입환율</span><b>${it.avg.toLocaleString("ko-KR",{maximumFractionDigits:2})}원</b></div>`:it.usd?`<div><span>환율 미적용 손익</span><b class="${cls(pu)}">${sign(pu)}${dol(Math.abs(pu))}</b></div><div><span>환율 미적용 수익률</span><b class="${cls(ru)}">${pct(ru)}</b></div><div><span>평균매입환율</span><b>${it.avg.toLocaleString("ko-KR",{maximumFractionDigits:2})}원</b></div>`:"";
   return`<div class="row"><button class="rw" data-k="${k}"><div class="av" style="background:${col(s,i)}">${ab}${/^(https?:\/\/|data:image)/i.test(it.logo)?`<img src="${it.logo.replace(/"/g,"&quot;")}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>
   <div class="nm"><b>${it.name}</b><small>${it.ticker} · ${it.qty.toLocaleString("ko-KR")}주</small></div>
   <div class="vl"><b>${f(it.v[m])}</b><small class="${cls(p)}">${pct(r)}</small></div></button>
   <div class="dt" ${o?"":"hidden"}>
    <div><span>현재가</span><b>${native(it,it.price)}</b></div><div><span>매수단가</span><b>${native(it,it.cost)}</b></div>
    <div><span>평가손익</span><b class="${cls(p)}">${sign(p)}${f(Math.abs(p))}</b></div><div><span>섹터 내 비중</span><b>${(it.v[cur]/sv*100).toFixed(1)}%</b></div>${ex}
   </div></div>`}).join("")+`</section>`}).join("");

 const hasTotal=chartRows.some(d=>d.y!==null);
 const hasComp=chartRows.some(d=>d.f!==null||d.g!==null||d.i!==null||d.k!==null||d.m!==null);
 const pieList=getPieItems();
 const pieTotal=pieList.reduce((s,x)=>s+x.v.KRW,0);
 const pieLegendHTML=pieList.map(it=>{
  const ratio=pieTotal?(it.v.KRW/pieTotal*100).toFixed(1):"0.0";
  return`<div class="pli"><div class="pli-l"><span class="pli-dot" style="background:${it.pieColor}"></span><span class="pli-nm">${it.name}</span></div><div class="pli-r"><span class="pli-v">${won(it.v.KRW)}</span><span class="pli-p">${ratio}%</span></div></div>`;
 }).join("");

 $("charts").innerHTML=
  `<section class="sec"><div class="sh"><b>총 평가금액 추이</b></div>`+
  (hasTotal?`<div class="cbox"><canvas id="totalChart"></canvas></div>`:`<div class="ph">추이 데이터를 불러오는 중이에요</div>`)+`</section>`+
  `<section class="sec"><div class="sh"><b>총 평가금액 vs 미국지수(환노출)</b></div>`+
  (hasComp?`<div class="cbox tall"><canvas id="compChart"></canvas></div>`:`<div class="ph">추이 데이터를 불러오는 중이에요</div>`)+`</section>`+
  `<section class="sec"><div class="sh"><b>종목별 자산 비중</b><select id="pieSort" class="sel" aria-label="정렬 기준"><option value="sector" ${pieSort==="sector"?"selected":""}>섹터순</option><option value="high" ${pieSort==="high"?"selected":""}>비중순</option></select></div>`+
  (pieList.length?`<div class="cbox pie"><canvas id="pieChart"></canvas></div><div class="pleg">${pieLegendHTML}</div>`:`<div class="ph">종목 데이터를 불러오는 중이에요</div>`)+`</section>`;

 $("list").hidden=view!=="list";$("charts").hidden=view!=="chart";$("note").hidden=view==="chart";
 $("note").textContent=mode==="usd"?"달러 종목은 환율을 적용하지 않은 달러 금액이에요.\n수익률에는 환차익이 포함되지 않아요":"달러 종목은 시트의 기준환율로 원화 환산했어요.\n수익률에는 환차익이 포함돼요"+(useNet?"\n투자수익은 순입금액 "+won(NET)+" 대비 값이에요":"");
 $("upd").textContent=src;
 if(items[0])$("fx").textContent="$1 = "+items[0].fx.toLocaleString("ko-KR",{maximumFractionDigits:2})+"원";
 if(view==="chart"){drawTotalChart();drawCompChart();drawPieChart();}
}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove("show"),2200)}
const clock=()=>new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});

async function fetchText(url,sig){
 const res=await fetch(url+"&_="+Date.now(),{signal:sig});
 if(!res.ok)throw new Error("HTTP "+res.status);
 const text=await res.text();
 if(text.trim().startsWith("<"))throw new Error("CSV가 아닌 응답");
 return text;
}

async function load(manual){
 let why="",ok=false;
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
 try{
  const [mainRes,chartRes]=await Promise.allSettled([
   fetchText(CSV_URL,ctl.signal),
   fetchText(CHART_CSV_URL,ctl.signal)
  ]);
  if(chartRes.status==="fulfilled"){
   const parsedChart=buildChart(chartRes.value);
   if(parsedChart.length)chartRows=parsedChart;
  }
  if(mainRes.status!=="fulfilled"){why=mainRes.reason&&mainRes.reason.message||"불러오기 실패";throw 0}
  if(!mainRes.value.includes("종목명")){why="CSV가 아닌 응답";throw 0}
  const next=build(mainRes.value);
  if(!next.length){why="데이터 없음";throw 0}
  items=next;src="구글시트 · "+clock()+" 업데이트";render();ok=true;
  if(manual)toast("최신 데이터로 바꿨어요");
 }catch(e){
  if(!why)why=e&&e.name==="AbortError"?"시간 초과":"네트워크 또는 보안 차단";
  src=src.replace(/ \(갱신 실패.*$/,"")+" (갱신 실패: "+why+")";
  $("upd").textContent=src;
  if(chartRows.length)render();
  if(manual)toast("불러오지 못했어요 · "+why);
 }finally{clearTimeout(tm);if(ok)$("introMsg").parentNode.style.visibility="hidden";else{$("introMsg").textContent="저장된 데이터로 시작해요";$("dots").style.display="none"}loaded=true;tryClose()}
}

$("mode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===mode)return;
 setMode(b.dataset.m);render()};
$("infoBtn").onclick=()=>{$("modalAmt").textContent=NET?won(NET):"-";$("modal").hidden=false};
$("modalOk").onclick=()=>{$("modal").hidden=true};
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").hidden=true};
$("netBtn").onclick=()=>{if(!useNet&&!NET){toast("시트에서 순입금액(O열 첫 행) 값을 찾지 못했어요");return}useNet=!useNet;syncNet();render()};
$("view").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.v===view)return;
 view=b.dataset.v;$("view").classList.toggle("b",view==="chart");
 [...$("view").querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b));render();scrollTo(0,0)};
$("list").onclick=e=>{const b=e.target.closest(".rw");if(!b)return;
 const k=b.dataset.k;openKey=openKey===k?null:k;render()};
$("charts").onchange=e=>{if(e.target&&e.target.id==="pieSort"){pieSort=e.target.value;render()}};
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(view==="chart"){drawTotalChart();drawCompChart();drawPieChart();}});

let introMin=false,loaded=false;
function closeIntro(){$("intro").classList.add("out")}
function tryClose(){if(introMin&&loaded)closeIntro()}
setTimeout(()=>{introMin=true;tryClose()},2200);
setTimeout(closeIntro,6000);

// 확대/축소 차단 (iOS 사파리는 user-scalable=no를 무시함)
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

// 툴팁 닫기: 차트 바깥을 누르거나, 스크롤하면 닫힘 (스크롤 중에는 툴팁을 보이지 않음)
function hideTips(except){
 [chartInst,compInst,pieInst].forEach(c=>{
  if(!c||c.canvas===except)return;
  try{
   if(!c.tooltip||!c.tooltip.getActiveElements().length)return;
   c.setActiveElements([]);
   c.tooltip.setActiveElements([],{x:0,y:0});
   c.update("none");
  }catch(err){}
 });
}
document.addEventListener("pointerdown",e=>hideTips(e.target.closest&&e.target.closest("canvas")));
window.addEventListener("scroll",()=>hideTips(null),{passive:true});

items=build(SNAPSHOT,295615604);render();load(false);
